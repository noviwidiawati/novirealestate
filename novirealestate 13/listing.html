<meta name="description" content="Bali villa and property listing presented by Novi Widiyawati, Bali Property & Marketing Strategist.">

<script>(function(){try{var t=localStorage.getItem("nw_theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script>
<style>
:root{--bg:#F3F2EE;--surface:#FFFFFF;--sunk:#E7E6E0;--ink:#171A19;--muted:#5E6360;--line:#D6D5CE;--brass:#9A7338;--brass-soft:#E9DDC7;--deep:#0E1613;--emerald:#12543E;--gold:#C9A36A;--wa:#1F7A4D;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--wrap:1180px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121614;--surface:#1A1F1D;--sunk:#202624;--ink:#EDEBE5;--muted:#A3A8A4;--line:#2E3532;--brass:#C9A36A;--brass-soft:#3A3223;--wa:#3FA873}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121614;--surface:#1A1F1D;--sunk:#202624;--ink:#EDEBE5;--muted:#A3A8A4;--line:#2E3532;--brass:#C9A36A;--brass-soft:#3A3223;--wa:#3FA873}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}a{color:inherit}
.wrap{max-width:var(--wrap);margin:auto;padding:0 clamp(16px,4vw,40px)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.12;text-wrap:balance}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:70px}
.brand{display:flex;text-decoration:none}.brand-mark{display:block;height:42px;width:auto}
.nav{display:flex;gap:8px;align-items:center}
.nav a{font:600 .82rem/1 var(--body);text-decoration:none;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.nav a.cta{background:#0b0e0c;color:#EADDBF;border-color:#0b0e0c}
@media (max-width:560px){.nav a.hide-sm{display:none}}
.eyebrow{font:500 .72rem/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 22px;border-radius:999px;font:600 .9rem/1 var(--body);text-decoration:none;border:0;cursor:pointer}
.btn-wa{background:var(--wa);color:#fff}.btn-dark{background:#0b0e0c;color:#EADDBF}.btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn svg{width:18px;height:18px}
.badge{display:inline-block;background:var(--surface);color:var(--ink);font:500 .66rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:7px 9px;border-radius:3px}
footer{margin-top:80px;padding:28px 0 40px;border-top:1px solid var(--line);color:var(--muted);font-size:.82rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
.empty{padding:80px 0;text-align:center;color:var(--muted)}

.crumb{padding:22px 0 8px;font:500 .74rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.crumb a{text-decoration:none;color:var(--muted)}.crumb a:hover{color:var(--brass)}
.gal{position:relative;border-radius:14px;overflow:hidden;background:var(--sunk);aspect-ratio:16/9;max-height:72vh}
.gal .slides{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal .slides::-webkit-scrollbar{display:none}
.gal .slides img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start}
.gal .arrow{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:rgba(10,14,12,.55);color:#fff;display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.gal .arrow svg{width:18px;height:18px}.gal .prev{left:14px}.gal .next{right:14px}
.gal .count{position:absolute;right:14px;bottom:14px;background:rgba(10,14,12,.6);color:#fff;font:500 .72rem/1 var(--mono);letter-spacing:.1em;padding:8px 11px;border-radius:999px}
.gal .badge{position:absolute;left:14px;top:14px}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.thumbs button{flex:0 0 auto;width:96px;aspect-ratio:4/3;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:var(--sunk);opacity:.7}
.thumbs button.on{border-color:var(--brass);opacity:1}.thumbs img{width:100%;height:100%;object-fit:cover}
.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:clamp(28px,5vw,64px);margin-top:clamp(26px,4vw,44px);align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.head h1{font-size:clamp(2rem,4.2vw,3.1rem);margin-top:12px}
.head .sum{color:var(--muted);font-size:1.06rem;margin:14px 0 0;max-width:60ch}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:28px 0}
.facts div{padding:14px 16px;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}.facts small{display:block;font:500 .66rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.facts b{display:block;margin-top:8px;font:500 1rem/1.25 var(--body)}
.body h2{font-size:1.5rem;margin:34px 0 12px}
.desc p{margin:0 0 14px}.desc ul{margin:0 0 14px;padding-left:20px}
.hl{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.hl li{position:relative;padding-left:22px}.hl li::before{content:"";position:absolute;left:0;top:.62em;width:10px;height:1px;background:var(--brass)}
.note{margin-top:22px;padding:14px 16px;border-left:2px solid var(--brass);background:var(--brass-soft);border-radius:0 8px 8px 0;font-size:.9rem}
.side{position:sticky;top:92px;display:grid;gap:14px}
.card{border-radius:16px;padding:22px;background:linear-gradient(155deg,#12543E 0%,#0A2C22 60%,#06180F 100%);color:#EFE8D8;box-shadow:inset 0 0 0 1px rgba(214,190,142,.38),0 24px 48px -20px rgba(0,0,0,.45)}
.card .price{font:500 1.5rem/1.2 var(--mono);color:#F1D9A1;font-variant-numeric:tabular-nums}
.card .pn{font-size:.85rem;color:rgba(239,232,216,.75);margin-top:6px}
.card hr{border:0;border-top:1px solid rgba(214,190,142,.3);margin:18px 0}
.card .who{display:flex;gap:12px;align-items:center}
.card .who img{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:50% 18%;box-shadow:0 0 0 2px rgba(214,190,142,.5)}
.card .who b{display:block;font:italic 400 1.15rem/1.1 var(--display);color:#F1D9A1}.card .who span{font-size:.8rem;color:rgba(239,232,216,.75)}
.card .acts{display:grid;gap:10px;margin-top:18px}
.card .btn-ghost{background:transparent;color:#EFE8D8;border-color:rgba(214,190,142,.45)}
.agency{font:500 .68rem/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center}
.more{margin-top:70px}.more h2{font-size:1.7rem;margin-bottom:18px}

.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:26px 22px}
.lcard{display:grid;grid-template-rows:auto 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;transition:border-color .2s,transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s}
.lcard:hover{border-color:var(--brass);transform:translateY(-3px);box-shadow:0 18px 34px -22px rgba(0,0,0,.4)}
.lcard .ph{position:relative;aspect-ratio:4/3;background:var(--sunk);overflow:hidden}.lcard .ph img{width:100%;height:100%;object-fit:cover;transition:transform 1s}
.lcard:hover .ph img{transform:scale(1.04)}.lcard .badge{position:absolute;left:12px;top:12px}
.lcard .bd{padding:18px 18px 20px;display:grid;gap:10px;align-content:start}
.lcard .loc{font:500 .7rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.lcard h3{font-size:1.22rem;line-height:1.22}
.lcard .pr{font:500 1rem/1.2 var(--mono);font-variant-numeric:tabular-nums}
.lcard .sp{display:flex;flex-wrap:wrap;gap:4px 14px;padding-top:10px;border-top:1px solid var(--line);font:400 .76rem/1.3 var(--mono);color:var(--muted)}

/* listing typography: Playfair + Manrope */
.head h1,.lcard h3{font-family:"Playfair Display",Georgia,serif;font-weight:600;letter-spacing:-.005em}.lcard .pr{font:700 1.08rem/1.2 "Manrope",var(--body);color:var(--brass);letter-spacing:.005em;font-variant-numeric:tabular-nums}.card .price{font:700 1.6rem/1.2 "Manrope",var(--body);letter-spacing:.005em}

/* currency toggle */
.curbox{display:grid;gap:8px;justify-items:start}
.curt{display:inline-flex;padding:3px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.curt button{font:600 .74rem/1 "Manrope",var(--body);letter-spacing:.08em;padding:8px 13px;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.curt button:hover{color:var(--ink)}
.curt button[aria-pressed="true"]{background:var(--brass);color:var(--surface)}
.curt button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.fxn{margin:0;font:400 .74rem/1.45 var(--body);color:var(--muted);max-width:44ch}
.pxs{display:block;font:500 .78rem/1.35 var(--body);color:var(--muted);margin-top:3px;letter-spacing:0}
.card .curbox{margin-bottom:16px}.card .curt{background:rgba(255,255,255,.06);border-color:rgba(241,217,161,.28)}.card .curt button{color:rgba(243,242,238,.7)}.card .curt button:hover{color:#fff}.card .curt button[aria-pressed="true"]{background:#F1D9A1;color:#10201a}.card .fxn{color:rgba(243,242,238,.6);font-size:.72rem;margin-top:10px}.card .pxs{color:rgba(243,242,238,.75);font-size:.86rem;margin-top:6px}
.thm{position:relative;display:inline-grid;place-items:center;width:40px;height:40px;flex:none;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;padding:0;transition:transform .2s,border-color .2s}.thm:hover{border-color:var(--brass)}.thm:active{transform:scale(.92)}.thm:focus-visible{outline:2px solid var(--brass);outline-offset:2px}.thm svg{position:absolute;width:18px;height:18px;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s}.thm .i-sun{opacity:0;transform:rotate(-90deg) scale(.5)}html.is-dark .thm .i-sun{opacity:1;transform:none}html.is-dark .thm .i-moon{opacity:0;transform:rotate(90deg) scale(.5)}.hdr-r{display:flex;align-items:center;gap:10px}
.sp span{display:inline-flex;align-items:center;gap:6px}.sp svg{width:15px;height:15px;flex:none;color:var(--brass)}

/* Headings: Playfair Display (clearer, bolder) */
h1,h2{font-family:"Playfair Display",Georgia,serif;font-weight:600;letter-spacing:-.015em}
h1 em,h2 em{font-weight:600}
.fly-title em{white-space:nowrap}
</style>
<script>
window.NWCUR=(function(){
  var K="nw_cur",KF="nw_fx",CS=["IDR","USD","AUD"],cur="IDR",fx={IDR:17920,AUD:1.434,t:0,date:""};
  try{var s=localStorage.getItem(K);if(CS.indexOf(s)>-1)cur=s}catch(e){}
  try{var c=JSON.parse(localStorage.getItem(KF)||"null");if(c&&c.IDR&&c.AUD)fx=c}catch(e){}
  var fmt=function(n){return Math.round(n).toLocaleString("en-US")};
  var k1=function(n){return Math.round(n/1000)*1000};
  var num=function(s){var d=String(s||"").replace(/[^\d]/g,"");return d?+d:0};
  function calc(el){
    var idr=el.getAttribute("data-idr")||"",usd=+el.getAttribute("data-usd")||0,base=usd||(num(idr)?num(idr)/fx.IDR:0);
    if(cur==="IDR"||!base)return{m:idr,s:usd?"Developer price: USD "+fmt(usd):""};
    if(cur==="USD")return{m:usd?"USD "+fmt(usd):"≈ USD "+fmt(k1(base)),s:"Official price: "+idr};
    return{m:"≈ AUD "+fmt(k1(base*fx.AUD)),s:"Official price: "+idr};
  }
  function note(){return cur==="IDR"?"":(cur==="USD"?"USD shown is the developer's price where given, otherwise an estimate. ":"AUD is an estimate. ")+"Rate: 1 USD = IDR "+fmt(fx.IDR)+" · AUD "+fx.AUD.toFixed(3)+(fx.date?" ("+fx.date+")":"")+". Official prices are in IDR."}
  function apply(){
    var a=document.querySelectorAll(".px"),i,r;
    for(i=0;i<a.length;i++){r=calc(a[i]);if(a[i].textContent!==r.m)a[i].textContent=r.m}
    a=document.querySelectorAll(".pxs");
    for(i=0;i<a.length;i++){r=calc(a[i]);if(a[i].textContent!==r.s)a[i].textContent=r.s;a[i].hidden=!r.s}
    a=document.querySelectorAll(".curt button");
    for(i=0;i<a.length;i++)a[i].setAttribute("aria-pressed",a[i].getAttribute("data-c")===cur?"true":"false");
    a=document.querySelectorAll(".fxn");
    for(i=0;i<a.length;i++){var t=note();if(a[i].textContent!==t)a[i].textContent=t;a[i].hidden=!t}
  }
  function html(noNote){return '<div class="curbox"><div class="curt" role="group" aria-label="Show prices in">'+CS.map(function(c){return '<button type="button" data-c="'+c+'">'+c+'</button>'}).join("")+'</div>'+(noNote?'':'<p class="fxn" hidden></p>')+'</div>'}
  function set(c){if(CS.indexOf(c)<0)return;cur=c;try{localStorage.setItem(K,c)}catch(e){}apply()}
  document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest(".curt button");if(b){e.preventDefault();set(b.getAttribute("data-c"))}});
  var q=0;new MutationObserver(function(){if(q)return;q=requestAnimationFrame(function(){q=0;apply()})}).observe(document.documentElement,{childList:true,subtree:true});
  document.addEventListener("DOMContentLoaded",apply);
  function save(o){fx=o;try{localStorage.setItem(KF,JSON.stringify(o))}catch(e){}apply()}
  if(!fx.t||Date.now()-fx.t>6*36e5){
    fetch("https://api.frankfurter.dev/v1/latest?base=USD&symbols=IDR,AUD").then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(d){save({IDR:d.rates.IDR,AUD:d.rates.AUD,t:Date.now(),date:d.date})})
    .catch(function(){return fetch("https://open.er-api.com/v6/latest/USD").then(function(r){return r.json()}).then(function(d){if(d.rates&&d.rates.IDR)save({IDR:d.rates.IDR,AUD:d.rates.AUD,t:Date.now(),date:new Date(d.time_last_update_unix*1000).toISOString().slice(0,10)})})})
    .catch(function(){});
  }
  return {html:html,apply:apply,set:set};
})();
</script>

<main class="wrap" id="main"><div class="empty">Loading listing…</div></main>
<footer><div class="wrap"><span>© <span id="yr">2026</span> Novi Widiyawati · Bali Property &amp; Marketing Strategist</span><span>Prices and details are provided by the developer or vendor and may change. Please verify with your notary before committing.</span></div></footer>
<script>
/*RENDER-START*/
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const img=p=>String((p&&p.image)||p||"").replace(/^\//,"");
const loadListings=()=>fetch("data/listings.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>(d&&d.listings)||[]);
const WA="6287781033323", EMAIL="noviwidiyawati89@gmail.com";
const waIcon='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.4 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.3-.8-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.5c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2.1 1.3 2.4 1.5.3.1.5.1.7-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.6.3.1.2.1.7-.1 1.3Z"/></svg>';
const md=t=>{const out=[];let ul=null;String(t||"").split(/\n/).forEach(line=>{const m=line.match(/^\s*[-•*]\s+(.*)/);
 if(m){if(!ul){ul=[];out.push(ul)}ul.push(m[1]);return} ul=null; if(line.trim())out.push(line.trim()); else out.push("")});
 let h="",para=[];const flush=()=>{if(para.length){h+=`<p>${esc(para.join(" "))}</p>`;para=[]}};
 out.forEach(b=>{if(Array.isArray(b)){flush();h+=`<ul>${b.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`}else if(b==="")flush();else para.push(b)});flush();return h};
const cardHTML=l=>{const p=(l.photos||[])[0];return `<a class="lcard" href="property/${encodeURIComponent(l.slug)}/">
 <div class="ph">${p?`<img src="${esc(img(p))}" alt="${esc(p.alt||l.title)}" loading="lazy">`:""}${l.badge?`<span class="badge">${esc(l.badge)}</span>`:""}</div>
 <div class="bd"><span class="loc">${esc(l.area)} · ${esc(l.tenure)}</span><h3>${esc(l.title)}</h3><div class="pr px" data-idr="${esc(l.price)}" data-usd="${l.price_usd||""}">${esc(l.price)}</div><span class="pxs" data-idr="${esc(l.price)}" data-usd="${l.price_usd||""}" hidden></span>
 <div class="sp">${l.bed?`<span title="Bedrooms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 18V6"/><path d="M2 14h20v4"/><path d="M22 18v-4a3 3 0 0 0-3-3h-8v3"/><circle cx="6.5" cy="10.5" r="1.8"/></svg>${l.bed_label||l.bed+" bed"}</span>`:""}${l.bath?`<span title="Bathrooms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16v2a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5v-2z"/><path d="M6 12V6a2 2 0 0 1 3.5-1.3"/><path d="M7 19l-1 2M17 19l1 2"/></svg>${l.bath} bath</span>`:""}${l.land?`<span title="Land size"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8V4h4M17 4h4v4M21 16v4h-4M7 20H3v-4"/><path d="M8 12h8M12 8v8" stroke-dasharray="2 2"/></svg>${esc(l.land)}</span>`:""}${l.building?`<span title="Building size"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1"/><path d="M10.5 21v-3h3v3"/></svg>${esc(l.building)}</span>`:""}${l.type?`<span title="Property type">${/apart/i.test(l.type)?`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 7h2M14 7h2M8 11h2M14 11h2M8 15h2M14 15h2"/></svg>`:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg>`}${esc(l.type)}</span>`:""}</div></div></a>`};

const SITE="https://noviwidiawati.com/";
const purl=l=>SITE+"property/"+encodeURIComponent(l.slug)+"/";
const renderMain=(l,all)=>{
  const photos=(l.photos||[]).filter(p=>img(p));
  const waText=encodeURIComponent(`Hi Novi, I'm interested in "${l.title}" (${l.area}, ${l.price}). Could you send me more details?\n${purl(l)}`);
  const mail=`mailto:${EMAIL}?subject=${encodeURIComponent("Enquiry: "+l.title)}&body=${waText}`;
  const fact=(k,v)=>v?`<div><small>${k}</small><b>${esc(v)}</b></div>`:"";
  return `
  <div class="crumb"><a href="./">Home</a> / <a href="listings.html">Listings</a> / ${esc(l.area)}</div>
  <div class="gal" id="gal">${l.badge?`<span class="badge">${esc(l.badge)}</span>`:""}
    <div class="slides" id="slides">${photos.map((p,i)=>`<img src="${esc(img(p))}" alt="${esc(p.alt||l.title)}"${i?' loading="lazy"':''}>`).join("")}</div>
    ${photos.length>1?`<button class="arrow prev" id="gp" aria-label="Previous photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button><button class="arrow next" id="gn" aria-label="Next photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><span class="count" id="gc">1 / ${photos.length}</span>`:""}
  </div>
  ${photos.length>1?`<div class="thumbs" id="thumbs">${photos.map((p,i)=>`<button type="button" class="${i?'':'on'}" aria-label="Photo ${i+1}"><img src="${esc(img(p))}" alt="" loading="lazy"></button>`).join("")}</div>`:""}
  <div class="layout">
    <div class="body">
      <div class="head"><span class="eyebrow">${esc(l.area)} · ${esc(l.tenure)}${l.status?` · ${esc(l.status)}`:""}</span><h1>${esc(l.title)}</h1>${l.summary?`<p class="sum">${esc(l.summary)}</p>`:""}</div>
      <div class="facts">${fact("Bedrooms",l.bed_label||l.bed)}${fact("Bathrooms",l.bath)}${fact("Land",l.land)}${fact("Building",l.building)}${fact("Type",l.type)}${fact("Ownership",l.tenure)}${fact("Lease",l.lease)}${fact("Status",l.status)}</div>
      ${l.description?`<h2>About this property</h2><div class="desc">${md(l.description)}</div>`:""}
      ${(l.highlights||[]).length?`<h2>Highlights</h2><ul class="hl">${l.highlights.map(h=>`<li>${esc(h)}</li>`).join("")}</ul>`:""}
      ${l.yield_note?`<div class="note">${esc(l.yield_note)}</div>`:""}
    </div>
    <aside class="side">
      <div class="card">
        ${NWCUR.html(1)}<div class="price px" data-idr="${esc(l.price)}" data-usd="${l.price_usd||""}">${esc(l.price)}</div><div class="pn pxs" data-idr="${esc(l.price)}" data-usd="${l.price_usd||""}" hidden></div>${l.price_note?`<div class="pn">${esc(l.price_note)}</div>`:""}<p class="fxn" hidden></p>
        <hr><div class="who"><img src="images/novi-portrait.jpg" alt=""><div><b>Novi Widiyawati</b><span>Bali Property &amp; Marketing Strategist</span></div></div>
        <div class="acts"><a class="btn btn-wa" href="https://wa.me/${WA}?text=${waText}" target="_blank" rel="noopener">${waIcon} Enquire on WhatsApp</a>
        <a class="btn btn-ghost" href="${mail}">Email Novi</a></div>
      </div>
      ${l.agency?`<div class="agency">Listed with ${esc(l.agency)}</div>`:""}
    </aside>
  </div>
  <section class="more"><h2>More listings</h2><div class="lgrid">${all.filter(x=>x.slug!==l.slug).slice(0,3).map(cardHTML).join("")}</div></section>`;
};
/*RENDER-END*/
document.getElementById("yr").textContent=new Date().getFullYear();
const id=window.__SLUG__||new URLSearchParams(location.search).get("id");
const main=document.getElementById("main");
loadListings().then(all=>{
  const l=all.find(x=>x.slug===id);
  if(!l){main.innerHTML=`<div class="empty"><h1>Listing not found</h1><p>This listing may have been sold or moved.</p><p><a class="btn btn-dark" href="listings.html">See all listings</a></p></div>`;return}
  document.title=`${l.title} · ${l.area} · Novi Widiyawati`;
  const photos=(l.photos||[]).filter(p=>img(p));
  main.innerHTML=renderMain(l,all);
  // gallery
  const sl=document.getElementById("slides"); if(!sl||photos.length<2) return;
  const th=[...document.querySelectorAll("#thumbs button")], gc=document.getElementById("gc");
  const cur=()=>Math.round(sl.scrollLeft/sl.clientWidth);
  const go=i=>{i=(i+photos.length)%photos.length;sl.scrollTo({left:i*sl.clientWidth,behavior:"smooth"})};
  document.getElementById("gp").onclick=()=>go(cur()-1); document.getElementById("gn").onclick=()=>go(cur()+1);
  th.forEach((b,i)=>b.onclick=()=>go(i));
  let t;sl.addEventListener("scroll",()=>{cancelAnimationFrame(t);t=requestAnimationFrame(()=>{const i=cur();gc.textContent=`${i+1} / ${photos.length}`;th.forEach((b,k)=>b.classList.toggle("on",k===i))})},{passive:true});
  addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(cur()+1);if(e.key==="ArrowLeft")go(cur()-1)});
}).catch(()=>{main.innerHTML=`<div class="empty">Listings could not be loaded. Please refresh the page.</div>`});
</script>
<script>(function(){var r=document.documentElement,mq=matchMedia("(prefers-color-scheme: dark)");function dark(){var t=r.getAttribute("data-theme");return t?t==="dark":mq.matches}function sync(){var d=dark();r.classList.toggle("is-dark",d);document.querySelectorAll(".thm").forEach(function(b){b.setAttribute("aria-label",d?"Switch to light mode":"Switch to dark mode");b.setAttribute("aria-pressed",d?"true":"false")})}document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest(".thm");if(!b)return;var n=dark()?"light":"dark";r.setAttribute("data-theme",n);try{localStorage.setItem("nw_theme",n)}catch(x){}sync()});(mq.addEventListener?mq.addEventListener("change",sync):mq.addListener(sync));sync()})();</script>
